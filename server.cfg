echo Executing Server Config...
port 7777
hostname SA-MP Drift Server
gamemode0 drift
lanmode 0
weather 10
weburl www.gtanet.com
unoccupiedcarscheck 1
sleep 5
maxnpc 0
maxplayers 50
timeout 10000
killdelay 0
pingboostthreshold 0
acconnecttimeout 5000
acconnectcookiefile acconnect.cookie
plugins sscanf streamer
filterscripts drift_system drift_zones player_data rewards
rcon_password password123
gamemode0 drift 1

// Дополнительные настройки
allow_admin_teleport 1
listen 1
ban_cmd_tell 0
nat_roaming 0
use_all_skin_id 1
return_to_author 1
default_vehicle_modelsfile vehicles.txt